[package]
name = "patronus-api-client"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Minimal client for the Patronus Scan API"
repository = "https://github.com/patronus-protect/patronus-security-cli"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
url = "2.5"
