name: API clients

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/patronus-api-client/**"
      - "src/scanning/api_client.rs"
      - "contract/**"
      - "sdk/**"
      - ".github/workflows/api-clients.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/patronus-api-client/**"
      - "src/scanning/api_client.rs"
      - "contract/**"
      - "sdk/**"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p patronus-api-client
      - run: cargo test --lib scanning::api_client
      - run: cargo publish --dry-run -p patronus-api-client --locked

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: api-tests
    env:
      PATRONUS_API_KEY: ${{ secrets.PATRONUS_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require dedicated test credential
        run: test -n "$PATRONUS_API_KEY"
      - run: cargo test -p patronus-api-client --test live -- --ignored
      - run: npm ci
        working-directory: sdk/typescript
      - run: npm run test:live
        working-directory: sdk/typescript
      - run: python -m unittest discover -s tests -p live_client.py -v
        working-directory: sdk/python
