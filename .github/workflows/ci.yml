name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Select test scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          heavy=false
          while IFS= read -r path; do
            case "$path" in
              plugins/*/skills/*) heavy=true; break ;;
              *.md|docs/*|.github/ISSUE_TEMPLATE/*) ;;
              *) heavy=true; break ;;
            esac
          done < <(git diff --name-only "$BASE_SHA"...HEAD)
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  baseline:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changed-file whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "push" && "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="HEAD^"
          fi
          git diff --check "$BASE_SHA"...HEAD
      - name: Validate repository JSON
        run: jq empty schemas/*.json plugins/codex/.codex-plugin/plugin.json plugins/claude/.claude-plugin/plugin.json plugins/deepseek/package.json sdk/typescript/package.json

  licenses:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check licenses

  test:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo build --release

  schemas-and-plugins:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: jq empty schemas/*.json plugins/codex/.codex-plugin/plugin.json plugins/claude/.claude-plugin/plugin.json
      - run: test -f plugins/codex/skills/patronus-security-scan/SKILL.md
      - run: test -f plugins/claude/skills/scan/SKILL.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/python -m unittest discover -s tests -p test_installer.py

  deepseek:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    env:
      DSH_SOURCE_ROOT: ${{ github.workspace }}/.harness
      PATRONUS_TEST_SCANNER: ${{ github.workspace }}/target/debug/patronus-security-scanner
      PATRONUS_SCANNER_BIN: ${{ github.workspace }}/target/debug/patronus-security-scanner
      PATRONUS_TEST_CONFIG: ${{ github.workspace }}/config/defaults.toml
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 76fda729799fe9b3848dbe2c211d4b231032b81e
          path: .harness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .harness
      - run: node plugins/native/scripts/build.mjs
      - run: git diff --exit-code -- plugins/codex/scripts/patronus.mjs plugins/claude/scripts/patronus.mjs
      - run: cargo build --locked
      - run: node plugins/native/scripts/typecheck.mjs
      - run: node plugins/native/scripts/test.mjs
      - run: node plugins/deepseek/scripts/test.mjs
      - run: node plugins/deepseek/scripts/test.mjs --local
      - run: cp THIRD_PARTY_NOTICES.md plugins/deepseek/THIRD_PARTY_NOTICES.md
      - run: npm --prefix plugins/deepseek run test:package
