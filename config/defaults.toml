schema_version = 1

[provider]
mode = "local"
api_base_url = "https://control.patronus.studio/api/v1"
api_key_env = "PATRONUS_API_KEY"

[scan]
respect_gitignore = true
respect_ignore_files = true
include_hidden = false
follow_symlinks = false
max_file_bytes = 10485760 # TODO(product): benchmark and tune
supported_encodings = ["utf-8", "utf-16le-bom", "utf-16be-bom"]

[ignore]
patterns = [
  ".git/",
  ".patronus-security-scanner/output/",
]

[chunking]
target_bytes = 65536 # TODO(product): align with Ark benchmark
overlap_bytes = 2048
prefer_line_boundaries = true

[ark]
# pii, dlp and Ark Core's attack classes. Opt-in classes: agent_config_tampering,
# memory_poisoning, unsafe_action, resource_exhaustion, harmful_content, toxic_language.
categories = ["pii", "dlp", "injection", "jailbreak", "prompt_extraction", "tool_poisoning", "exfiltration"]
# l1: rules and Ark Core's built-in L1 models; l3: + Wolf Defender Edge for injection.
max_level = "l1"
download_files = false
queue_capacity = 8

[progress]
mode = "auto"
plain_interval_seconds = 5
eta_min_seconds = 3
eta_min_bytes = 1048576

[output]
root = "~/.patronus-security-scanner/output"
include_chunk_content = false
include_evidence_text = false
write_progress_events = false

[support]
endpoint = "" # TODO(product): insert production endpoint before enabling upload
default_artifacts = [
  "manifest.json",
  "report.json",
  "effective-config.toml",
  "failures.jsonl",
  "classifications.jsonl",
]
max_bundle_bytes = 52428800

[runtime]
response_wait_ms = 1000
request_timeout_ms = 30000
scan_timeout_ms = 60000
retention_seconds = 2592000
max_payload_bytes = 10485760
max_store_bytes = 536870912
max_pending_jobs = 64

[analysis]
# Local scoring modes: strict, balanced or recall (independent).
pii_mode = "strict"
dlp_mode = "strict"
user_prompt_pii = false

# Ark Core's built-in L1 model per attack class; all on unless set false.
[analysis.l1_models]
# jailbreak = false

# Cascade cuts per category (Ark defaults when unset): detect_threshold and
# clear_threshold of the rules, l1_detect_threshold, l1_clear_threshold and
# l1_clear_enabled of the L1 model.
# Attack classes other than injection: text without a rule signal (score below
# 0.05) is clear, so their L1 models only judge what the rules found. Without
# this cut the L1 models flagged plain code and security docs in the hook QA.
# injection keeps every undecided input for its L1 model and Wolf.
[analysis.cascade]
jailbreak = { clear_threshold = 0.05 }
prompt_extraction = { clear_threshold = 0.05 }
tool_poisoning = { clear_threshold = 0.05 }
exfiltration = { clear_threshold = 0.05 }
agent_config_tampering = { clear_threshold = 0.05 }
memory_poisoning = { clear_threshold = 0.05 }
unsafe_action = { clear_threshold = 0.05 }
resource_exhaustion = { clear_threshold = 0.05 }
harmful_content = { clear_threshold = 0.05 }
toxic_language = { clear_threshold = 0.05 }

[analysis.l1_detectors]
# hidden_html_instruction = true
# unicode_confusable = true
# secret_transfer = true

# Cat ask verdicts run as low by default; use "ask" for host approval.
[shell.default]
ask_behavior = "low"
