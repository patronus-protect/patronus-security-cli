[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Patronus Security is the Apache-2.0 community project. Patronus Ark remains
# GPL-3.0-only and is intentionally approved as this first-party dependency;
# the exception does not allow GPL dependencies generally.
exceptions = [
  { crate = "patronus-ark", allow = ["GPL-3.0-only"] },
]
